        \ \"| Image tag | \\`${GITHUB_SHA::12}\\` |\"\n  echo \"\"\n  echo \"Security\
        \ artefacts for this run: Semgrep SAST, Gitleaks, licence report,\"\n  echo\
        \ \"dependency SBOM and image SBOM are attached to the workflow run.\"\n}\
        \ >> \"$GITHUB_STEP_SUMMARY\"\n"
