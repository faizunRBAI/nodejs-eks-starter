    - name: Health check
      run: "set -euo pipefail\nfor _ in $(seq 1 40); do\n  CODE=\"$(curl -sS -o /dev/null\
        \ -w '%{http_code}' --max-time 10 \"${APP_URL}/health\" || true)\"\n  if [\
        \ \"$CODE\" = \"200\" ]; then\n    echo \"Service is healthy at ${APP_URL}\"\
        \n    curl -sS --max-time 10 \"${APP_URL}/api/info\" || true\n    exit 0\n\
        \  fi\n  sleep 15\ndone\necho \"The service never returned 200 from /health\
        \ in 10 minutes.\"\necho \"--- pods ---\"\nkubectl get pods -n \"${{ secrets.PROJECT_NAME\
        \ }}\" -o wide || true\necho \"--- application log ---\"\nkubectl logs -n\
        \ \"${{ secrets.PROJECT_NAME }}\" -l app.kubernetes.io/name=api --tail=100\
        \ || true\necho \"--- endpoints (empty means no pod passed its readiness probe)\
        \ ---\"\nkubectl get endpoints api -n \"${{ secrets.PROJECT_NAME }}\" -o wide\
        \ || true\necho \"::error::The load balancer answered but /health never returned\
        \ 200. Check the application log above, and whether the readiness probe on\
        \ /ready is passing.\"\nexit 1\n"
  notify:
    runs-on: ubuntu-latest
    needs:
    - verify
    steps:
    - uses: actions/checkout@v4
    - name: Deployment summary
      run: "{\n  echo \"### Deployment complete\"\n  echo \"\"\n  echo \"| | |\"\n\
        \  echo \"|---|---|\"\n  echo \"| Cluster | \\`${{ secrets.PROJECT_NAME }}-eks\\\
