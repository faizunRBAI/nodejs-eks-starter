name: destroy
'on':
  workflow_dispatch: {}
jobs:
  destroy:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
    steps:
    - uses: actions/checkout@v4
    - uses: azure/setup-kubectl@v4
      with:
        version: v1.33.0
    - uses: hashicorp/setup-terraform@v3
      with:
        terraform_wrapper: false
    - name: Read the VPC id from state
      run: "terraform init -input=false -reconfigure \\\n  -backend-config=\"bucket=${{\
        \ secrets.TF_STATE_BUCKET }}\" \\\n  -backend-config=\"key=${{ secrets.PROJECT_NAME\
        \ }}/terraform.tfstate\" \\\n  -backend-config=\"region=${AWS_REGION}\"\n\
        echo \"VPC_ID=$(terraform output -raw vpc_id 2>/dev/null || true)\" >> \"\
        $GITHUB_ENV\"\n"
      working-directory: infra
    - name: Delete the Kubernetes load balancer
      run: "NAMESPACE=\"${{ secrets.PROJECT_NAME }}\"\nif ! aws eks update-kubeconfig\
        \ --name \"${NAMESPACE}-eks\" --region \"$AWS_REGION\" 2>/dev/null; then\n\
        \  echo \"Cluster is already gone \u2014 nothing to clean up in Kubernetes.\"\
        \n  exit 0\nfi\nkubectl delete svc --all -n \"$NAMESPACE\" --ignore-not-found\
        \ --timeout=5m || true\nkubectl delete namespace \"$NAMESPACE\" --ignore-not-found\
        \ --timeout=5m || true\n\nif [ -z \"${VPC_ID:-}\" ]; then\n  echo \"No vpc_id\
        \ in state \u2014 falling back to a fixed wait.\"\n  sleep 180\n  exit 0\n\
        fi\n\n# Poll until nothing is left in the VPC, rather than sleeping and hoping.\n\
        echo \"Waiting for AWS to finish deleting load balancers in ${VPC_ID}.\"\n\
        for _ in $(seq 1 40); do\n  V2=\"$(aws elbv2 describe-load-balancers \\\n\
        \         --query \"length(LoadBalancers[?VpcId=='${VPC_ID}'])\" --output\
        \ text 2>/dev/null || echo 0)\"\n  V1=\"$(aws elb describe-load-balancers\
        \ \\\n         --query \"length(LoadBalancerDescriptions[?VPCId=='${VPC_ID}'])\"\
        \ --output text 2>/dev/null || echo 0)\"\n  echo \"  load balancers remaining:\
        \ elbv2=${V2} classic=${V1}\"\n  if [ \"$V2\" = \"0\" ] && [ \"$V1\" = \"\
        0\" ]; then\n    echo \"All load balancers deleted.\"\n    # The network interfaces\
        \ outlive the load balancer by a few seconds.\n    sleep 30\n    exit 0\n\
        \  fi\n  sleep 15\ndone\necho \"::warning::Load balancers still present after\
        \ 10 minutes; attempting the destroy anyway.\"\n"
    - name: Terraform destroy
      run: "# No -e: the first attempt is allowed to fail so the retry can run.\n\
        # init already happened in the VPC-id step, in this same directory.\nset -uo\
        \ pipefail\nif terraform destroy -input=false -auto-approve; then\n  echo\
        \ \"Destroy complete.\"\n  exit 0\nfi\necho \"::warning::First destroy attempt\
        \ failed \u2014 waiting 90s for dependent resources to clear, then retrying.\"\
        \nsleep 90\nterraform destroy -input=false -auto-approve\n"
      working-directory: infra
